<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>React App</title>

    <script>
      // Generate a cryptographically secure nonce
      const nonce = btoa(crypto.getRandomValues(new Uint8Array(16)).join(''));
      window.__CSP_NONCE__ = nonce;

      // Create the CSP meta tag dynamically
      const cspMetaTag = document.createElement("meta");
      cspMetaTag.httpEquiv = "Content-Security-Policy";
      cspMetaTag.content = `default-src 'self'; 
                            script-src 'self' 'nonce-${nonce}';
                            style-src 'self' 'nonce-${nonce}';
                            img-src 'self' data:;
                            font-src 'self' data:;
                            connect-src 'self';
                            object-src 'none';`;

      document.head.appendChild(cspMetaTag);
  </script>

<!-- ✅ This is the insertion point for JSS styles -->
<!-- <style id="jss-insertion-point"></style> -->
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
